name: Deploy E-Shop to EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: EC2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::075566976432:role/github-actions-ec2-deployer
          aws-region: us-east-1

      - name: Deploy via SSM Run Command
        run: |
          aws ssm send-command \
            --instance-ids "i-0f6ed43d788ae88c9" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ec2-user/Web_lab_12", "git pull origin main", "docker compose up -d --build"]' \
            --region us-east-1